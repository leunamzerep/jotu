<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Página no encontrada</title>
  <script>
    (function () {
      const redirectPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      sessionStorage.setItem("spa-fallback", redirectPath);
      window.location.replace("/");
    })();
  </script>
</head>

<body>
  <p>Redirecting… / Redirigiendo…</p>
  <noscript>
    <p>This page does not exist. <a href="/">Go to the home page</a>.</p>
    <p lang="es">Esta página no existe. <a href="/">Ir al inicio</a>.</p>
  </noscript>
</body>

</html>
