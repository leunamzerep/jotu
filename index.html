<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Título de respaldo: PageSeo pone en cada página su title, description,
       canonical, og:* y twitter:* (src/components/seo/PageSeo.tsx) -->
  <title>JoTu Solutions</title>
  <meta name="author" content="JoTu Solutions LLC" />

  <!-- Íconos (public/): pestaña del navegador, iPhone/iPad y manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1c7b7e" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Helpers -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <script>
    (function () {
      const redirectPath = sessionStorage.getItem("spa-fallback");
      if (!redirectPath) return;
      sessionStorage.removeItem("spa-fallback");

      const url = new URL(redirectPath, window.location.origin);
      const newUrl = url.pathname + url.search + url.hash;
      const currentUrl =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      if (newUrl !== currentUrl) {
        window.history.replaceState(null, "", newUrl);
      }
    })();
  </script>
</head>

<body style="margin:0">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
