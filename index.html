<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Título de respaldo: PageSeo pone en cada página su title, description,
       canonical, og:* y twitter:* (src/components/seo/PageSeo.tsx) -->
  <title>JoTu Solutions</title>
  <meta name="author" content="JoTu Solutions LLC" />

  <!-- Íconos (public/): pestaña del navegador, iPhone/iPad y manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1c7b7e" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    html.spa-redirect body {
      visibility: hidden;
    }
  </style>
  <script>
    (function () {
      const redirectPath = sessionStorage.getItem("spa-fallback");
      if (!redirectPath) return;
      sessionStorage.removeItem("spa-fallback");

      // Oculta la página hasta que React muestre la ruta pedida (src/app/App.tsx
      // quita la clase). Así no se ve Inicio un instante. Por seguridad, se
      // muestra igual a los 3 segundos.
      document.documentElement.classList.add("spa-redirect");
      setTimeout(function () {
        document.documentElement.classList.remove("spa-redirect");
      }, 3000);

      const url = new URL(redirectPath, window.location.origin);
      const newUrl = url.pathname + url.search + url.hash;
      const currentUrl =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      if (newUrl !== currentUrl) {
        window.history.replaceState(null, "", newUrl);
      }
    })();
  </script>
</head>

<body style="margin:0">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
